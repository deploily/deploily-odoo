services:
  db:
    image: postgres:14-bullseye
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432/tcp
    environment:
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_DB=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
  web:
    container_name: deploily-odoo
    image: odoo:17.0-20260803
    depends_on:
      - db
    ports:
      - "8069:8069/tcp"
    volumes:
      - web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./src:/mnt/deploily-addons

volumes:
  db-data:
    driver: local
  web-data:
    driver: local
